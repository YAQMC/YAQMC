[package]
name = "yaqmc"
version = "0.1.0"
description = "Yet Another Q Music Client"
authors = ["maintainers"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "yaqmc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
base64 = "0.22"
futures-util = "0.3"
keyring = "4.1.6"
lyrics-crypto = "0.1.3"
md-5 = "0.10.6"
quick-xml = "0.38"
rand = "0.9"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls", "stream", "system-proxy"] }
rodio = { version = "0.22.2", default-features = false, features = ["flac", "mp3", "mp4", "playback", "tracing", "wav"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.4"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.10.0"
raw-window-handle = "0.6"
webkit2gtk-sys = "2.0.2"

[target.'cfg(windows)'.dependencies]
souvlaki = { version = "0.8.3", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
