[[set]]
identifier = "main-application"
description = "Allows the trusted main application WebView to use non-account application commands."
permissions = [
  "allow-platform-diagnostics",
  "allow-platform-export-diagnostics",
  "allow-system-integration-status",
  "allow-system-shortcuts-set-enabled",
  "allow-audio-output-devices",
  "allow-audio-set-output-device",
  "allow-qqmusic-status",
  "allow-qqmusic-home",
  "allow-qqmusic-library",
  "allow-qqmusic-search",
  "allow-qqmusic-album",
  "allow-qqmusic-playlist",
  "allow-qqmusic-lyrics",
  "allow-qqmusic-cache-artwork",
  "allow-qqmusic-set-preferred-quality",
  "allow-qqmusic-set-current-quality",
  "allow-qqmusic-cache-stats",
  "allow-qqmusic-clear-cache",
  "allow-player-snapshot",
  "allow-player-hydrate-queue",
  "allow-player-play-tracks",
  "allow-player-play-from-queue",
  "allow-player-play",
  "allow-player-pause",
  "allow-player-toggle",
  "allow-player-next",
  "allow-player-previous",
  "allow-player-seek",
  "allow-player-set-volume",
  "allow-player-toggle-muted",
  "allow-player-toggle-shuffle",
  "allow-player-set-shuffle",
  "allow-player-cycle-repeat",
  "allow-player-add-to-queue",
  "allow-player-add-tracks-to-queue",
  "allow-player-remove-from-queue",
  "allow-player-set-lyrics",
  "allow-player-lyrics",
  "allow-lyrics-surface-projection",
  "allow-app-preferences-get",
  "allow-app-preferences-set",
  "allow-appearance-pick-background",
  "allow-appearance-background-load",
  "allow-lyrics-surfaces-reconcile",
  "allow-lyrics-surface-capabilities",
  "allow-lyrics-surface-status",
  "allow-lyrics-surfaces-unlock-all",
  "allow-lyrics-surface-close",
  "allow-lyrics-surface-set-interaction",
  "allow-lyrics-surface-reset-position",
  "allow-lyrics-surface-show-settings",
  "allow-local-api-status",
  "allow-local-api-set-enabled",
  "allow-local-api-set-port",
  "allow-local-api-reveal-token",
  "allow-local-api-regenerate-token",
  "allow-debug-perf-sample",
