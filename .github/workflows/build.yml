name: Build desktop bundles

on:
  workflow_dispatch:
    inputs:
      target:
        description: Desktop bundle to build
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux-appimage:
    name: Linux x86_64 AppImage
    if: ${{ inputs.target == '' || inputs.target == 'all' || inputs.target == 'linux' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
      - name: Install Tauri and audio dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          libasound2-dev
      - run: npm ci
      - name: Build AppImage
        run: npm run tauri -- build --bundles appimage
      - name: Stage tester bundle
        run: |
          mkdir -p release/YAQMC-linux-x86_64
          cp src-tauri/target/release/bundle/appimage/*.AppImage release/YAQMC-linux-x86_64/
          cp scripts/collect-linux-diagnostics.sh release/YAQMC-linux-x86_64/
          cp docs/linux.md release/YAQMC-linux-x86_64/TESTING.md
      - uses: actions/upload-artifact@v4
        with:
          name: YAQMC-linux-x86_64
          path: release/YAQMC-linux-x86_64
          if-no-files-found: error
          retention-days: 14

  windows-nsis:
    name: Windows x86_64 NSIS
    if: ${{ inputs.target == '' || inputs.target == 'all' || inputs.target == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
      - run: npm ci
      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: YAQMC-windows-x86_64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
