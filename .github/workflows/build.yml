name: Build desktop bundles

on:
  workflow_dispatch:
    inputs:
      target:
        description: Desktop bundle to build
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  account-secret-scan:
    name: Account secret scan (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked account artifacts (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/check-secrets.sh --self-test && bash scripts/check-secrets.sh
      - name: Scan tracked account artifacts (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-secrets.ps1 -SelfTest
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-secrets.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-qqmusic-auth-preflight.ps1 -SelfTest

  linux-appimage:
    name: Linux x86_64 AppImage
    needs: account-secret-scan
    if: ${{ inputs.target == '' || inputs.target == 'all' || inputs.target == 'linux' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
      - name: Install Tauri and audio dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          libasound2-dev
      - run: npm ci
      - name: Build AppImage
        run: npm run tauri -- build --bundles appimage
      - name: Stage tester bundle
        run: |
          mkdir -p release/YAQMC-linux-x86_64
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output /tmp/appimagetool-x86_64.AppImage
          echo 'a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0  /tmp/appimagetool-x86_64.AppImage' | sha256sum --check
          chmod +x /tmp/appimagetool-x86_64.AppImage scripts/repack-appimage-gdk-backend.sh
          source_appimage="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$source_appimage"
          scripts/repack-appimage-gdk-backend.sh \
            "$source_appimage" \
            /tmp/appimagetool-x86_64.AppImage \
            "release/YAQMC-linux-x86_64/$(basename "$source_appimage")"
          final_appimage="$GITHUB_WORKSPACE/release/YAQMC-linux-x86_64/$(basename "$source_appimage")"
          verify_dir="$(mktemp -d)"
          (
            cd "$verify_dir"
            "$final_appimage" --appimage-extract >/dev/null
            grep -F '# YAQMC session-aware GTK backend policy' squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh
            grep -F 'export GDK_BACKEND=wayland' squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh
            grep -F 'export GDK_BACKEND=x11' squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh
          )
          cp scripts/collect-linux-diagnostics.sh release/YAQMC-linux-x86_64/
          cp scripts/verify-lyrics-acceptance.mjs release/YAQMC-linux-x86_64/
          cp docs/linux.md release/YAQMC-linux-x86_64/TESTING.md
          cp docs/linux-acceptance.md release/YAQMC-linux-x86_64/ACCEPTANCE.md

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          export BUILD_GIT_TREE="$(git rev-parse 'HEAD^{tree}')"
          export BUILD_APP_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")"
          export BUILD_APPIMAGE_FILE="$(basename "$final_appimage")"
          export BUILD_APPIMAGE_SHA="$(sha256sum "$final_appimage" | cut -d' ' -f1)"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const required = (name, pattern) => {
            const value = process.env[name];
            if (!value || !pattern.test(value)) throw new Error(`Invalid ${name}`);
            return value;
          };
          const identity = {
            schemaVersion: 1,
            gitCommit: required('GITHUB_SHA', /^[a-f0-9]{40}$/),
            gitTree: required('BUILD_GIT_TREE', /^[a-f0-9]{40}$/),
            workflowRunId: required('GITHUB_RUN_ID', /^\d+$/),
            workflowRunAttempt: required('GITHUB_RUN_ATTEMPT', /^\d+$/),
            appVersion: required(
              'BUILD_APP_VERSION',
              /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/,
            ),
            appImage: {
              fileName: required('BUILD_APPIMAGE_FILE', /^[^/\\]+\.AppImage$/),
              sha256: required('BUILD_APPIMAGE_SHA', /^[a-f0-9]{64}$/),
            },
          };
          writeFileSync(
            'release/YAQMC-linux-x86_64/BUILD-IDENTITY.json',
            `${JSON.stringify(identity, null, 2)}\n`,
          );
          NODE
          (
            cd release/YAQMC-linux-x86_64
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' | sort -z | xargs -0 sha256sum >SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          node scripts/verify-lyrics-acceptance.mjs \
            --platform linux \
            --identity-only \
            --build-identity "$GITHUB_WORKSPACE/release/YAQMC-linux-x86_64/BUILD-IDENTITY.json"
      - uses: actions/upload-artifact@v4
        with:
          name: YAQMC-linux-x86_64
          path: release/YAQMC-linux-x86_64
          if-no-files-found: error
          retention-days: 14

  windows-nsis:
    name: Windows x86_64 NSIS
    needs: account-secret-scan
    if: ${{ inputs.target == '' || inputs.target == 'all' || inputs.target == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
      - run: npm ci
      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: YAQMC-windows-x86_64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
