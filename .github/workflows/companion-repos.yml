name: Check companion API export
on:
  push:
    branches: [main]
    paths:
      - 'sdk/plugin/**'
      - 'wit/**'
      - 'src/application/plugin-*.ts'
      - 'crates/yaqmc-core/src/plugin/**'
      - 'docs/plugin-*.md'
      - 'docs/zh-CN/plugin-*.md'
      - 'docs/provider-component-api.md'
      - 'docs/zh-CN/provider-component-api.md'
      - 'scripts/sync-plugin-example.mjs'
      - '.github/workflows/companion-repos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.7.0
      - run: npm ci --ignore-scripts
      - run: node scripts/sync-plugin-example.mjs --out "$RUNNER_TEMP/yaqmc-plugins"
      - run: node scripts/sync-plugin-example.mjs --out "$RUNNER_TEMP/yaqmc-plugins" --check
