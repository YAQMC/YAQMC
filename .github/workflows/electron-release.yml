name: YAQMC release

on:
  workflow_dispatch:
    inputs:
      targets:
        description: Electron packaging matrix to build
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - linux
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  YAQMC_BUILD_PROFILE: production
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  CARGO_PROFILE_RELEASE_LTO: 'true'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'

jobs:
  release-gates:
    name: Provider pin and provenance release gates
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
      - name: Validate release version and signing prerequisites
        env:
          YAQMC_TARGETS: ${{ inputs.targets || 'all' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          YAQMC_WINDOWS_SIGNER_SUBJECT: ${{ secrets.YAQMC_WINDOWS_SIGNER_SUBJECT }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: node scripts/ci/release-preflight.mjs
      - run: node scripts/ci/qm-api-rs-access.mjs --check
      - run: npm run provider:enforce
      - run: npm run provenance:enforce

  android-package:
    name: Android release package (arm64-v8a)
    needs: [release-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: npm
      - uses: ./.github/actions/setup-android
      - run: npm ci
      - name: Require and materialize Android release signing credentials
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_STORE_PASSWORD \
            ANDROID_RELEASE_KEY_PASSWORD \
            ANDROID_RELEASE_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "The release-signing environment is missing required secret ${name}" >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/yaqmc-android-release.keystore"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"
          echo "ANDROID_RELEASE_KEYSTORE=$keystore" >> "$GITHUB_ENV"
      - name: Build signed Android release APK
        shell: bash
        env:
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          args=(--variant release --stage-to release-android)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          node scripts/build-android.mjs "${args[@]}"
      - name: Verify Android signature and checksum
        shell: bash
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find release-android -maxdepth 1 -type f -name '*.apk' -print)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one staged Android APK, found ${#apks[@]}" >&2
            exit 1
          fi
          signer_output="$(
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
              verify --verbose --print-certs "${apks[0]}"
          )"
          actual_digest="$(
            printf '%s\n' "$signer_output" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
              head -n 1 |
              tr -d ':[:space:]' |
              tr '[:upper:]' '[:lower:]'
          )"
          expected_digest="$(
            printf '%s' "$ANDROID_RELEASE_CERT_SHA256" |
              tr -d ':[:space:]' |
              tr '[:upper:]' '[:lower:]'
          )"
          if [[ ! "$actual_digest" =~ ^[0-9a-f]{64}$ ]] || [ "$actual_digest" != "$expected_digest" ]; then
            echo "Android release signer certificate does not match the expected SHA-256 digest" >&2
            exit 1
          fi
          (cd release-android && sha256sum --check SHA256SUMS-android.txt)
      - name: Remove Android signing material
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/yaqmc-android-release.keystore"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: YAQMC-android-arm64-v8a-${{ github.sha }}
          path: release-android
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  frontend-build:
    needs: [release-gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - run: npm run ci:frontend-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yaqmc-frontend-dist-${{ github.sha }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  electron-package-matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.select.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
      - id: select
        env:
          YAQMC_EVENT_NAME: ${{ github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || 'push' }}
          YAQMC_TARGETS: ${{ inputs.targets || 'all' }}
        run: node scripts/ci/select-electron-package-matrix.mjs

  electron-package:
    name: Electron package ${{ matrix.os }} ${{ matrix.arch }}
    needs: [frontend-build, electron-package-matrix]
    environment: release-signing
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.electron-package-matrix.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      YAQMC_PREBUILT_FRONTEND: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-packaging
        with:
          target: ${{ matrix.target }}
          profile: ${{ env.YAQMC_BUILD_PROFILE }}
      - name: Linux electron-builder packaging tools
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends libasound2-dev rpm fakeroot
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: yaqmc-frontend-dist-${{ github.sha }}
          path: dist
      - name: Require Windows Authenticode credentials
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          YAQMC_WINDOWS_SIGNER_SUBJECT: ${{ secrets.YAQMC_WINDOWS_SIGNER_SUBJECT }}
        run: |
          $required = @('WIN_CSC_LINK', 'WIN_CSC_KEY_PASSWORD', 'YAQMC_WINDOWS_SIGNER_SUBJECT')
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "The release-signing environment is missing required secret $name"
            }
          }
      - name: Compile core, then pack Electron
        env:
          WIN_CSC_LINK: ${{ matrix.os == 'windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.os == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: >-
          node scripts/ci/package-electron.mjs
          --target ${{ matrix.target }}
          --os ${{ matrix.os }}
          --arch ${{ matrix.arch }}
          --require-signing ${{ matrix.os == 'windows' && 'true' || 'false' }}
      - name: Verify Windows Authenticode signer
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          YAQMC_WINDOWS_SIGNER_SUBJECT: ${{ secrets.YAQMC_WINDOWS_SIGNER_SUBJECT }}
        run: |
          $artifactDir = Join-Path 'release-electron' 'YAQMC-electron-windows-${{ matrix.arch }}'
          $expectedNames = @(
            'YAQMC-windows-${{ matrix.arch }}-setup.exe',
            'YAQMC-windows-${{ matrix.arch }}-portable.exe'
          )
          foreach ($name in $expectedNames) {
            $file = Join-Path $artifactDir $name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing signed release artifact $name"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Authenticode validation failed for $name with status $($signature.Status)"
            }
            if ($null -eq $signature.SignerCertificate -or -not [string]::Equals(
              $signature.SignerCertificate.Subject,
              $env:YAQMC_WINDOWS_SIGNER_SUBJECT,
              [System.StringComparison]::OrdinalIgnoreCase
            )) {
              throw "Authenticode signer identity mismatch for $name"
            }
            Write-Output "Verified Authenticode signature for $name"
          }
      - name: Stage and verify Linux x64 tester artifact
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        run: |
          node scripts/ci/stage-linux-tester.mjs \
            --package-dir release-electron/YAQMC-electron-linux-x64 \
            --to release-electron/YAQMC-linux-x64-tester
          node scripts/verify-lyrics-acceptance.mjs \
            --platform linux \
            --identity-only \
            --build-identity "$PWD/release-electron/YAQMC-linux-x64-tester/BUILD-IDENTITY.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: YAQMC-electron-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          path: release-electron/YAQMC-electron-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        with:
          name: YAQMC-linux-x64-tester-${{ github.sha }}
          path: release-electron/YAQMC-linux-x64-tester
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ matrix.target }}-1.88-${{ hashFiles('Cargo.lock') }}-${{ env.YAQMC_BUILD_PROFILE }}

  assemble:
    name: Assemble release assets
    needs: [electron-package, android-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout exact qm-api-rs corresponding source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: YAQMC/qm-api-rs
          ref: 7d0f6e18b1d1d89a06cc5964e9c057acb0926ea5
          path: .corresponding-source/qm-api-rs
          persist-credentials: false
      - name: Checkout exact AMLL corresponding source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: amll-dev/applemusic-like-lyrics
          ref: fd7ec2d597daa2a66a37ca5f3214d6757ec17cfa
          path: .corresponding-source/applemusic-like-lyrics
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
      - name: Build exact corresponding-source archives
        run: >-
          node scripts/ci/corresponding-source.mjs
          --qm-api-rs-root .corresponding-source/qm-api-rs
          --amll-root .corresponding-source/applemusic-like-lyrics
          --to corresponding-source
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: YAQMC-electron-*
          path: packed
          merge-multiple: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: YAQMC-android-arm64-v8a-${{ github.sha }}
          path: packed-android
      - name: Validate and flatten release assets
        run: >-
          node scripts/ci/assemble-release.mjs
          --electron-from packed
          --android-from packed-android
          --source-from corresponding-source
          --to assembled
          --commit ${{ github.sha }}
          --targets ${{ inputs.targets || 'all' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: YAQMC-release-draft-${{ github.sha }}
          path: assembled
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  github-release-draft:
    name: Draft GitHub Release
    needs: [assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: YAQMC-release-draft-${{ github.sha }}
          path: assembled
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="electron-draft-${GITHUB_RUN_ID}"
          fi
          gh release create "$tag" assembled/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "YAQMC ${tag} (draft)" \
            --notes-file assembled/RELEASE-NOTES.md
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            gh release edit "$tag" --draft=false --prerelease=false --latest --title "YAQMC $tag"
          fi
