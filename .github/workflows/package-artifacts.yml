name: Build artifacts
run-name: Build artifacts · ${{ inputs.targets }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      targets:
        description: Platforms to package
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
          - android
      optimization:
        description: Desktop native optimization profile
        required: true
        default: ci
        type: choice
        options:
          - ci
          - production

concurrency:
  group: artifacts-${{ github.workflow }}-${{ github.ref }}-${{ inputs.targets }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  YAQMC_BUILD_PROFILE: ${{ inputs.optimization == 'production' && 'production' || 'ci-release' }}
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  frontend-build:
    name: Build desktop renderer
    if: inputs.targets != 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - run: npm run ci:frontend-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: yaqmc-frontend-dist-${{ github.sha }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  desktop-matrix:
    name: Select desktop targets
    if: inputs.targets != 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.select.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.7.0
      - id: select
        env:
          YAQMC_TARGETS: ${{ inputs.targets }}
        run: node scripts/ci/select-electron-package-matrix.mjs

  desktop-package:
    name: Package ${{ matrix.os }} ${{ matrix.arch }}
    needs: [frontend-build, desktop-matrix]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.desktop-matrix.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      YAQMC_PREBUILT_FRONTEND: '1'
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.optimization == 'production' && 'true' || 'thin' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.optimization == 'production' && '1' || '8' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-packaging
        with:
          target: ${{ matrix.target }}
          profile: ${{ env.YAQMC_BUILD_PROFILE }}
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends libasound2-dev rpm fakeroot
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: yaqmc-frontend-dist-${{ github.sha }}
          path: dist
      - name: Build Core and package Electron
        run: >-
          node scripts/ci/package-electron.mjs
          --target ${{ matrix.target }}
          --os ${{ matrix.os }}
          --arch ${{ matrix.arch }}
      - name: Verify macOS bundle architecture and ad-hoc signature
        if: matrix.os == 'macos'
        run: >-
          node scripts/ci/verify-macos-package.mjs
          --dir release-electron/YAQMC-electron-macos-${{ matrix.arch }}
          --arch ${{ matrix.arch }}
          --signed false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: YAQMC-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          path: release-electron/YAQMC-electron-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.88-${{ hashFiles('Cargo.lock') }}-${{ env.YAQMC_BUILD_PROFILE }}

  android-package:
    name: Package Android test APK
    if: inputs.targets == 'all' || inputs.targets == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.7.0
          cache: npm
      - uses: ./.github/actions/setup-android
      - run: npm ci
      - name: Build Android renderer, native libraries, and debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-android.mjs --variant debug --stage-to release-android
      - name: Record APK checksum
        working-directory: release-android
        run: sha256sum -- *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: YAQMC-android-debug-${{ github.sha }}
          path: release-android
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
