name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      targets:
        description: Packaging matrix to build
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - linux
      optimization:
        description: Native optimization profile
        required: true
        default: ci
        type: choice
        options:
          - ci
          - production

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  YAQMC_BUILD_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.optimization == 'production' && 'production' || 'ci-release' }}
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run docs:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test -w @yaqmc/client
      - run: npm run test -w @yaqmc/desktop
      - run: node scripts/ci/legacy-host-imports.mjs
      - run: node scripts/ci/electron-security-lint.mjs
      - run: node scripts/ci/qm-api-rs-access.mjs --check
      - run: npm run ci:test-scripts

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run ci:frontend-build
      - uses: actions/upload-artifact@v7
        with:
          name: yaqmc-frontend-dist-${{ github.sha }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  electron-build:
    name: Electron build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @yaqmc/client
      - run: npm run typecheck -w @yaqmc/desktop
      - run: npm run build -w @yaqmc/desktop

  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          components: clippy, rustfmt
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-x86_64-unknown-linux-gnu-stable-${{ hashFiles('Cargo.lock') }}-dev
          restore-keys: |
            cargo-${{ runner.os }}-x86_64-unknown-linux-gnu-stable-
      - run: npm run ci:verify-workspace
      - name: Check the unconditional qm-api-rs pin
        run: node scripts/ci/qm-api-rs-access.mjs --check
      - name: Authenticate private qm-api-rs when the token is present
        env:
          CI: 'true'
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          QM_API_RS_TOKEN: ${{ secrets.QM_API_RS_TOKEN }}
        run: node scripts/ci/qm-api-rs-access.mjs --configure-git
      - name: Prepare frontend stub for cargo-only builds
        run: mkdir -p dist && printf '<!doctype html><html><body></body></html>' > dist/index.html
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      - run: cargo test --workspace --all-targets --locked
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      - run: npm run contracts:check
      - uses: actions/cache/save@v4
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-x86_64-unknown-linux-gnu-stable-${{ hashFiles('Cargo.lock') }}-dev

  secret-scan:
    name: Secret scan (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked account artifacts (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/check-secrets.sh --self-test && bash scripts/check-secrets.sh
      - name: Scan tracked account artifacts (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-secrets.ps1 -SelfTest
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-secrets.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-qqmusic-auth-preflight.ps1 -SelfTest

  electron-package-matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.select.outputs.include }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - id: select
        env:
          YAQMC_EVENT_NAME: ${{ github.event_name }}
          YAQMC_TARGETS: ${{ inputs.targets }}
        run: node scripts/ci/select-electron-package-matrix.mjs

  electron-package:
    name: Electron package ${{ matrix.os }} ${{ matrix.arch }}
    needs: [frontend-build, electron-package-matrix]
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.electron-package-matrix.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      YAQMC_PREBUILT_FRONTEND: '1'
      CARGO_PROFILE_RELEASE_LTO: ${{ github.event_name == 'workflow_dispatch' && inputs.optimization == 'production' && 'true' || 'thin' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ github.event_name == 'workflow_dispatch' && inputs.optimization == 'production' && '1' || '8' }}
    steps:
      - uses: actions/checkout@v7
      - name: Require the requested runner architecture
        run: echo "Electron packaging ${{ matrix.target }} on ${{ runner.os }} / ${{ matrix.runner }} cross=${{ matrix.cross }}"
      - uses: ./.github/actions/setup-packaging
        with:
          target: ${{ matrix.target }}
          profile: ${{ env.YAQMC_BUILD_PROFILE }}
          qm-api-rs-token: ${{ secrets.QM_API_RS_TOKEN }}
      - name: Linux electron-builder packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm fakeroot
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: yaqmc-frontend-dist-${{ github.sha }}
          path: dist
      - name: Compile core, then pack Electron
        run: >-
          node scripts/ci/package-electron.mjs
          --target ${{ matrix.target }}
          --os ${{ matrix.os }}
          --arch ${{ matrix.arch }}
      - name: Job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Electron ${{ matrix.os }} ${{ matrix.arch }}"
            echo "- rust target: \`${{ matrix.target }}\`"
            echo "- cross: \`${{ matrix.cross }}\`"
            echo "- profile: \`${{ env.YAQMC_BUILD_PROFILE }}\`"
            echo "- publish: never"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: YAQMC-electron-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          path: release-electron/YAQMC-electron-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/cache/save@v4
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ matrix.target }}-1.88-${{ hashFiles('Cargo.lock') }}-${{ env.YAQMC_BUILD_PROFILE }}

  summarize:
    name: CI summary
    if: always()
    needs:
      [
        frontend-quality,
        frontend-build,
        rust-quality,
        secret-scan,
        electron-build,
        electron-package-matrix,
        electron-package,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Write workflow summary
        shell: bash
        run: |
          {
            echo "## Workflow"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- event: \`${{ github.event_name }}\`"
            echo "- profile: \`${{ env.YAQMC_BUILD_PROFILE }}\`"
            echo "- frontend-quality: \`${{ needs.frontend-quality.result }}\`"
            echo "- frontend-build: \`${{ needs.frontend-build.result }}\`"
            echo "- rust-quality: \`${{ needs.rust-quality.result }}\`"
            echo "- electron-build: \`${{ needs.electron-build.result }}\`"
            echo "- secret-scan: \`${{ needs.secret-scan.result }}\`"
            echo "- electron-package-matrix: \`${{ needs.electron-package-matrix.result }}\`"
            echo "- electron-package: \`${{ needs.electron-package.result }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if a required job failed
        if: >-
          needs.frontend-quality.result != 'success' ||
          needs.frontend-build.result != 'success' ||
          needs.rust-quality.result != 'success' ||
          needs.electron-build.result != 'success' ||
          needs.secret-scan.result != 'success' ||
          needs.electron-package-matrix.result != 'success' ||
          needs.electron-package.result == 'failure' ||
          needs.electron-package.result == 'cancelled'
        run: exit 1
