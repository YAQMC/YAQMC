name: Set up YAQMC Android toolchain
description: Install the pinned Java, Android, Rust, and cargo-ndk toolchain.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: '1.88.0'
        targets: aarch64-linux-android,x86_64-linux-android
        components: clippy,rustfmt
    - name: Install pinned Android SDK and NDK
      shell: bash
      run: |
        set -euo pipefail
        yes | sdkmanager --licenses >/dev/null || true
        sdkmanager \
          'platforms;android-36' \
          'build-tools;36.0.0' \
          'ndk;28.2.13676358'
        echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "$GITHUB_ENV"
    - name: Install cargo-ndk 4.1.2
      shell: bash
      run: |
        set -euo pipefail
        if ! cargo ndk --version 2>/dev/null | grep -F 'cargo-ndk 4.1.2' >/dev/null; then
          cargo install cargo-ndk --version 4.1.2 --locked
        fi
