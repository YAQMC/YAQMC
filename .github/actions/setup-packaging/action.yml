name: Setup Node, Rust, and Cargo cache restore
description: Install pinned Node and Rust toolchains and restore the target-specific Cargo cache.

inputs:
  target:
    description: Rust target triple, or host for native validation.
    required: true
  profile:
    description: Cache profile class (dev, ci-release, or production).
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 26.7.0
        cache: npm
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: '1.88.0'
        targets: ${{ inputs.target }}
        components: clippy, rustfmt
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-1.88-${{ hashFiles('Cargo.lock') }}-${{ inputs.profile }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-1.88-${{ hashFiles('Cargo.lock') }}-
          cargo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-1.88-
