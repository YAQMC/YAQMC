name: 功能建议
description: 提议一个有明确使用场景且符合项目安全边界的功能。
title: '[Feature] '
labels:
  - enhancement
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述具体场景和当前阻碍，不要只写功能名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 包括入口、交互、平台差异和失败时的行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: dropdown
    id: platforms
    attributes:
      label: 目标平台
      multiple: true
      options:
        - Windows
        - Linux X11 / XWayland
        - Linux 原生 Wayland
        - 所有桌面平台
  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认
      options:
        - label: 本建议不要求绕过会员、地区、版权、DRM 或伪造 VMP/账号权益。
          required: true
        - label: 本建议不要求收集、导入或公开用户 Cookie/凭据。
          required: true
