# PACK-01: NSIS/portable + Linux AppImage/deb/rpm/tar.gz + macOS dmg/zip (x64, arm64).
# UPD-01: GitHub Releases provider for electron-updater metadata. Local packs must
# pass --publish never (do not draft a release from a maintainer laptop).
# The release workflow currently publishes unsigned Windows packages.
# Explicit signed builds can opt into electron-builder.release.yml.
appId: org.yaqmc.desktop
productName: YAQMC
copyright: GPL-3.0-or-later
asar: true
electronVersion: 43.8.3
publish:
  provider: github
  owner: YAQMC
  repo: YAQMC
protocols:
  - name: YAQMC catalog links
    schemes:
      - yaqmc
directories:
  output: ../../release-electron
  buildResources: resources
files:
  - dist/main/**
  - dist/preload/**
  # The main process resolves the tray/window icon relative to the packaged
  # app root (`resources/app.asar/resources`). buildResources is not included
  # in the asar automatically, so keep the runtime icon assets explicit.
  - resources/icon.ico
  - resources/icon.png
  - resources/icon.icns
  - '!dist/**/*.map'
  # The client is bundled by esbuild; workspace dependency collection otherwise
  # includes its source, tests and fixtures in the production archive.
  - '!node_modules/@yaqmc/client{,/**}'
extraMetadata:
  main: dist/main/index.js
extraResources:
  - from: resources/updater
    to: updater
    filter:
      - 'yaqmc-update-helper*'
      - 'manifest.json'
  - from: resources/core
    to: core
    filter:
      - '!**/*.md'
      - '!**/.gitkeep'
  # Vite renderer from the repo dist/ (YAQMC_PREBUILT_FRONTEND on CI). Packaged
  # Main serves this from process.resourcesPath/renderer, not the ELEC-04 harness.
  - from: ../../dist
    to: renderer
    filter:
      - '**/*'
      - '!**/*.map'
  # Main-process IPC ACL; packaged apps must not resolve this from the source tree.
  - from: ../../packages/yaqmc-client/fixtures/methods.json
    to: contract/methods.json
# Binding amendment + SEC-02: Chromium sandbox stays enabled.
# grantFileProtocolExtraPrivileges stays false so file:// cannot bypass sandbox.
# EnableEmbeddedAsarIntegrityValidation is a Windows/macOS Electron feature, not a Linux anti-tamper claim.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
  # macOS: flipping fuses rewrites the Electron binary; re-apply an ad-hoc signature so an
  # unsigned arm64 build still launches. Developer ID signing replaces it afterwards.
  resetAdHocDarwinSignature: true
win:
  icon: resources/icon.ico
  # Keep electron-updater's publisher verification enabled for signed NSIS updates.
  verifyUpdateCodeSignature: true
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: YAQMC-windows-${arch}-setup.${ext}
portable:
  # electron-builder 26.15.7: true omits UNPACK_DIR_NAME, using a unique NSIS
  # $PLUGINSDIR per launch so a second launch cannot remove the running app.
  unpackDirName: true
  artifactName: YAQMC-windows-${arch}-portable.${ext}
linux:
  icon: resources
  category: AudioVideo
  maintainer: YAQMC contributors <64585305+Osilvfe@users.noreply.github.com>
  executableName: yaqmc
  syncDesktopName: true
  artifactName: YAQMC-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
    - target: tar.gz
      arch:
        - x64
        - arm64
# macOS defaults describe the signed release shape. Unsigned/local builds go through
# scripts/ci/package-electron.mjs, which switches to an ad-hoc identity without hardened
# runtime or notarization (see docs/macos.md).
mac:
  icon: resources/icon.icns
  category: public.app-category.music
  # Electron 43 supports macOS 12 Monterey and newer.
  minimumSystemVersion: '12.0'
  artifactName: YAQMC-macos-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/macos/entitlements.mac.plist
  entitlementsInherit: resources/macos/entitlements.mac.inherit.plist
  notarize: false
  extendInfo:
    LSApplicationCategoryType: public.app-category.music
    NSHumanReadableCopyright: GPL-3.0-or-later
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
dmg:
  artifactName: YAQMC-macos-${arch}.${ext}
