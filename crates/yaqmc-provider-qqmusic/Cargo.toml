[package]
name = "yaqmc-provider-qqmusic"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []

[dependencies]
async-trait = "0.1"
base64 = "0.22"
md-5 = "0.10.6"
qqmusic-api = { git = "https://github.com/YAQMC/qm-api-rs.git", rev = "7d0f6e18b1d1d89a06cc5964e9c057acb0926ea5" }
quick-xml = "0.38"
rand = "0.9"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls", "stream", "system-proxy", "cookies", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
yaqmc-provider-api = { path = "../yaqmc-provider-api" }
zeroize = "1"

[dev-dependencies]
axum = "0.8"
futures-util = "0.3"
lyrics-crypto = "0.1.3"
rodio = { version = "0.22.2", default-features = false, features = ["flac"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tracing-subscriber = "0.3"
yaqmc-core = { path = "../yaqmc-core", features = ["test-support"] }
