[package]
name = "yaqmc-component-host-guest"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dlmalloc = { version = "=0.2.11", default-features = false, features = ["global"] }
wit-bindgen = { version = "=0.46.0", default-features = false, features = ["macros", "realloc"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[workspace]
