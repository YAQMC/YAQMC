[package]
name = "yaqmc-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "yaqmc_core"
crate-type = ["cdylib"]

[dependencies]
jni = "0.22.4"
ndk-context = "0.1.1"
rustls-platform-verifier = "0.7"
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
yaqmc-core = { path = "../yaqmc-core", default-features = false }
yaqmc-protocol = { path = "../yaqmc-protocol" }
