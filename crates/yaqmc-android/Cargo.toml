[package]
name = "yaqmc-android"
version = "0.1.3-beta.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "yaqmc_core"
crate-type = ["cdylib"]

[dependencies]
jni = "0.22.4"
ndk-context = "0.1.1"
rustls-platform-verifier = "0.7.1"
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
# Desktop-only system-media/local-api stay off; plugins run the Wasm provider host on Android.
yaqmc-core = { path = "../yaqmc-core", default-features = false, features = ["plugins"] }
yaqmc-protocol = { path = "../yaqmc-protocol" }
